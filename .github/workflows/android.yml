name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Stamp version (1.3.<run number>) into the app
        run: |
          sed -i "s/APP_VERSION = '\([0-9]*\.[0-9]*\)\.0'/APP_VERSION = '\1.${GITHUB_RUN_NUMBER}'/" www/js/version.js
          grep APP_VERSION www/js/version.js
      - name: Use the fixed debug key so every new APK installs OVER the old one
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Install dependencies
        run: npm install
      - name: Generate Android project (first run) and sync web assets
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Raise the Android versionCode on every build (needed for in-place updates)
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.3.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pubali-deposit-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
